[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
license = "Apache-2.0"
name = "caliban-sdk"
version = "0.1.0"
description = "Python SDK for Caliban: OpenAI-compatible data-plane client, admin API client, node authoring and an eval harness."
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Elie Sfeir", email = "elie@internalizable.dev" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[project.scripts]
caliban-eval = "caliban.evals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caliban"]

[tool.hatch.build.targets.sdist]
include = ["src/caliban", "tests", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "PT011", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
